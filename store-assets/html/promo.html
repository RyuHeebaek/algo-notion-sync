<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Algo Notion Sync — promo tile</title>
<link rel="stylesheet" href="base.css">
<style>
  body{
    width:440px;height:280px;
    background:
      radial-gradient(300px 220px at 88% 6%, rgba(255,255,255,.30), rgba(255,255,255,0) 68%),
      linear-gradient(146deg,#2B6CFF 0%,#4C4FEF 46%,#7C3AED 100%);
  }
  .tile{position:relative;width:440px;height:280px;padding:34px 34px 0;color:#fff}
  .mark{width:62px;height:62px;border-radius:16px;background:rgba(255,255,255,.16);
    border:1px solid rgba(255,255,255,.32);display:grid;place-items:center;
    box-shadow:0 10px 24px rgba(14,20,60,.28)}
  .mark svg{width:34px;height:34px}
  h1{margin:20px 0 0;font-size:27px;line-height:1.16;font-weight:800;letter-spacing:-.028em;color:#fff}
  p{margin:9px 0 0;font-size:13px;line-height:1.55;color:rgba(255,255,255,.88);font-weight:500}
  .chips{display:flex;gap:6px;margin-top:16px}
  .chip{height:23px;display:inline-flex;align-items:center;padding:0 9px;border-radius:6px;
    background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.26);
    font-size:10.5px;font-weight:700;color:#fff;letter-spacing:-.01em}
  .glow{position:absolute;right:-70px;bottom:-90px;width:260px;height:260px;border-radius:50%;
    background:radial-gradient(circle, rgba(255,255,255,.16), rgba(255,255,255,0) 66%)}
</style>
</head>
<body>
<div class="tile">
  <div class="mark">
    <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2"
         stroke-linecap="round" stroke-linejoin="round">
      <polyline points="8 7 4 12 8 17"></polyline>
      <line x1="14.5" y1="6.5" x2="9.5" y2="17.5"></line>
      <polyline points="16 7 20 12 16 17"></polyline>
    </svg>
  </div>
  <h1>Algo Notion Sync</h1>
  <p>SWEA · 정올 · 백준 정답을<br>Notion 데이터베이스에 자동 저장</p>
  <div class="chips">
    <span class="chip">자동 동기화</span>
    <span class="chip">코드 블록</span>
    <span class="chip">비밀번호 저장 없음</span>
  </div>
  <div class="glow"></div>
</div>
</body>
</html>
